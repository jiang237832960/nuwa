[workspace]
resolver = "2"
members = [
    "crates/nuwa-core",
    "crates/nuwa-agent",
    "crates/nuwa-world",
    "crates/nuwa-self",
    "crates/nuwa-memory",
    "crates/nuwa-forge",
    "crates/nuwa-growth",
    "crates/nuwa-inference",
    "crates/nuwa-tools",
    "crates/nuwa-audit",
    "crates/nuwa-kernel",
    "crates/nuwa-device",
    "crates/nuwa-benchmark-cn",
    "crates/nuwa-copy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Nuwa Team"]
rust-version = "1.75"

[workspace.dependencies]
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
parking_lot = "0.12"
dashmap = "5.5"
once_cell = "1.19"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
